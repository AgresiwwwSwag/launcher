<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PolitMine Launcher | Вход в игру</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .container {
            background: rgba(255,255,255,0.1);
            backdrop-filter: blur(15px);
            border-radius: 30px;
            padding: 40px;
            max-width: 550px;
            width: 100%;
            box-shadow: 0 25px 50px -12px rgba(0,0,0,0.5);
            border: 1px solid rgba(255,255,255,0.2);
            animation: fadeIn 0.6s ease-out;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .tabs { display: flex; gap: 10px; margin-bottom: 30px; border-bottom: 2px solid rgba(255,255,255,0.2); }
        .tab { flex: 1; padding: 12px; background: none; border: none; color: rgba(255,255,255,0.6); font-size: 18px; font-weight: bold; cursor: pointer; transition: all 0.3s ease; }
        .tab.active { color: #ffd700; border-bottom: 3px solid #ffd700; }
        .form-group { margin-bottom: 20px; }
        label { display: block; color: white; margin-bottom: 8px; font-size: 14px; }
        input {
            width: 100%; padding: 12px; background: rgba(255,255,255,0.15);
            border: 1px solid rgba(255,255,255,0.3); border-radius: 10px;
            color: white; font-size: 16px; transition: all 0.3s ease;
        }
        input:focus { outline: none; border-color: #ffd700; background: rgba(255,255,255,0.2); }
        button {
            width: 100%; padding: 14px; background: linear-gradient(135deg, #667eea, #764ba2);
            border: none; border-radius: 10px; color: white; font-size: 16px;
            font-weight: bold; cursor: pointer; transition: all 0.3s ease; margin-top: 10px;
        }
        button:hover { transform: translateY(-2px); box-shadow: 0 10px 20px rgba(0,0,0,0.3); }
        .error { background: rgba(244,67,54,0.2); border: 1px solid #f44336; border-radius: 10px; padding: 10px; margin: 10px 0; color: #ff8a80; display: none; }
        .success { background: rgba(76,175,80,0.2); border: 1px solid #4caf50; border-radius: 10px; padding: 10px; margin: 10px 0; color: #81c784; display: none; }
        .user-info { background: rgba(0,0,0,0.5); border-radius: 15px; padding: 20px; margin-bottom: 20px; display: none; }
        .role { display: inline-block; padding: 4px 12px; border-radius: 20px; font-size: 12px; font-weight: bold; margin-left: 10px; }
        .role-admin { background: #f44336; color: white; }
        .role-premium { background: #ffd700; color: #333; }
        .role-user { background: #4caf50; color: white; }
        .game-section { display: none; }
        .online-list { background: rgba(0,0,0,0.5); border-radius: 15px; padding: 15px; margin-top: 20px; max-height: 200px; overflow-y: auto; }
        .online-player { padding: 8px; margin: 5px 0; background: rgba(255,255,255,0.1); border-radius: 8px; display: flex; justify-content: space-between; }
        .admin-panel { display: none; }
        .admin-card { background: rgba(0,0,0,0.5); border-radius: 15px; padding: 20px; margin: 15px 0; }
        .user-list-item { display: flex; justify-content: space-between; align-items: center; padding: 10px; margin: 5px 0; background: rgba(255,255,255,0.1); border-radius: 10px; flex-wrap: wrap; gap: 10px; }
        .role-select { padding: 5px; border-radius: 5px; background: rgba(0,0,0,0.7); color: white; border: 1px solid #ffd700; }
        .logout-btn { background: rgba(244,67,54,0.8); margin-top: 10px; }
        .modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.8);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 10000;
            animation: fadeIn 0.2s ease;
        }
        .modal-content {
            background: #1e1e2e;
            border-radius: 20px;
            padding: 30px;
            max-width: 500px;
            width: 90%;
            border: 2px solid #ffd700;
            box-shadow: 0 20px 40px rgba(0,0,0,0.5);
        }
        .instruction-step {
            background: rgba(255,255,255,0.1);
            padding: 12px;
            margin: 10px 0;
            border-radius: 10px;
            display: flex;
            align-items: center;
            gap: 15px;
        }
        .step-number {
            width: 30px;
            height: 30px;
            background: #ffd700;
            color: #333;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
        }
    </style>
</head>
<body>
<div class="container" id="app">
    <div id="authTabs">
        <div class="tabs">
            <button class="tab active" onclick="switchTab('login')">🔑 Вход</button>
            <button class="tab" onclick="switchTab('register')">📝 Регистрация</button>
        </div>
        <div id="errorMsg" class="error"></div>
        <div id="successMsg" class="success"></div>
        <div id="loginForm">
            <div class="form-group"><label>👤 Логин</label><input type="text" id="loginUsername" placeholder="Введите логин"></div>
            <div class="form-group"><label>🔒 Пароль</label><input type="password" id="loginPassword" placeholder="Введите пароль"></div>
            <button onclick="login()">Войти</button>
            <button onclick="showAdminLogin()" style="background: rgba(0,0,0,0.5); margin-top: 10px;">👑 Вход в админ-панель</button>
        </div>
        <div id="registerForm" style="display: none;">
            <div class="form-group"><label>👤 Логин</label><input type="text" id="regUsername" placeholder="От 3 до 16 символов"></div>
            <div class="form-group"><label>📧 Email</label><input type="email" id="regEmail" placeholder="example@mail.com"></div>
            <div class="form-group"><label>🔒 Пароль</label><input type="password" id="regPassword" placeholder="Не менее 6 символов"></div>
            <div class="form-group"><label>🔒 Подтвердите пароль</label><input type="password" id="regConfirmPassword" placeholder="Повторите пароль"></div>
            <button onclick="register()">Зарегистрироваться</button>
        </div>
    </div>
    <div id="adminLoginForm" style="display: none;">
        <div class="form-group"><label>👑 Админ логин</label><input type="text" id="adminUsername" placeholder="admin"></div>
        <div class="form-group"><label>🔒 Админ пароль</label><input type="password" id="adminPassword" placeholder="********"></div>
        <button onclick="adminLogin()">Войти в админку</button>
        <button onclick="backToUserLogin()" style="background: rgba(0,0,0,0.5);">← Назад</button>
    </div>
    <div id="userPanel" class="user-info" style="display: none;">
        <div style="display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 10px;">
            <div>👋 Привет, <strong id="userName"></strong><span id="userRole" class="role"></span></div>
            <button onclick="logout()" class="logout-btn" style="width: auto; padding: 5px 15px;">🚪 Выйти</button>
        </div>
        <div style="margin-top: 15px; font-size: 14px;">📅 Зарегистрирован: <span id="regDate"></span></div>
    </div>
    <div id="gameSection" class="game-section" style="display: none;">
        <div style="text-align: center; margin: 20px 0;">
            <div style="font-size: 48px;">🎮</div>
            <h3 style="color: white;">POLITMINE SERVER</h3>
            <p style="color: rgba(255,255,255,0.7); font-size: 14px;">Версия 1.20.4 | Minecraft Java Edition</p>
        </div>
        <button id="installGameBtn" onclick="installGame()">📥 Установить игру на диск D:</button>
        <button id="playGameBtn" onclick="launchGame()" style="display: none;">🎮 ЗАПУСТИТЬ ИГРУ</button>
        <div class="online-list">
            <div style="font-weight: bold; margin-bottom: 10px;">🟢 Онлайн игроки (<span id="onlineCount">0</span>)</div>
            <div id="onlinePlayersList">Загрузка...</div>
        </div>
    </div>
    <div id="adminPanel" class="admin-panel" style="display: none;">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; flex-wrap: wrap; gap: 10px;">
            <h2 style="color: white;">👑 Админ панель</h2>
            <button onclick="exitAdmin()" style="width: auto; padding: 5px 15px; background: #f44336;">Выйти</button>
        </div>
        <div class="admin-card">
            <h3 style="color: white; margin-bottom: 15px;">📊 Статистика сервера</h3>
            <p style="color: white;">👥 Всего игроков: <strong id="totalUsers">0</strong></p>
            <p style="color: white;">🟢 Онлайн сейчас: <strong id="adminOnlineCount">0</strong></p>
            <p style="color: white;">📦 Игра установлена у: <strong id="installedCount">0</strong></p>
        </div>
        <div class="admin-card">
            <h3 style="color: white; margin-bottom: 15px;">👥 Управление игроками</h3>
            <div id="usersList"></div>
        </div>
        <div class="admin-card">
            <h3 style="color: white; margin-bottom: 15px;">🔧 Настройки сервера</h3>
            <div class="form-group">
                <label>Ссылка на версию Minecraft (Google Drive ID)</label>
                <input type="text" id="gameUrlSetting" placeholder="Введите ID файла из Google Drive">
            </div>
            <button onclick="updateGameUrl()">Сохранить</button>
        </div>
    </div>
</div>

<script>
    const API_URL = "https://launcher-server-ddk3.onrender.com";
    const GAME_DIR = "D:\\PolitMine";
    
    let currentUser = null;
    
    async function register() {
        const username = document.getElementById('regUsername').value.trim();
        const email = document.getElementById('regEmail').value.trim();
        const password = document.getElementById('regPassword').value;
        const confirm = document.getElementById('regConfirmPassword').value;
        
        if (username.length < 3 || username.length > 16) { showError('Логин от 3 до 16 символов'); return; }
        if (!email.includes('@')) { showError('Введите корректный email'); return; }
        if (password.length < 6) { showError('Пароль не менее 6 символов'); return; }
        if (password !== confirm) { showError('Пароли не совпадают'); return; }
        
        try {
            const response = await fetch(`${API_URL}/api/register`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ username, email, password })
            });
            const data = await response.json();
            if (data.success) {
                showSuccess('Регистрация успешна! Теперь войдите');
                setTimeout(() => switchTab('login'), 1500);
            } else {
                showError(data.error);
            }
        } catch (error) {
            showError('Ошибка сервера: ' + error.message);
        }
    }
    
    async function login() {
        const username = document.getElementById('loginUsername').value.trim();
        const password = document.getElementById('loginPassword').value;
        if (!username || !password) { showError('Введите логин и пароль'); return; }
        
        try {
            const response = await fetch(`${API_URL}/api/login`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ username, password })
            });
            const data = await response.json();
            if (data.success) {
                currentUser = data.user;
                localStorage.setItem('current_user', JSON.stringify(currentUser));
                showSuccess('Вход выполнен!');
                loadUserPanel();
                document.getElementById('authTabs').style.display = 'none';
                document.getElementById('userPanel').style.display = 'block';
                document.getElementById('gameSection').style.display = 'block';
            } else {
                showError(data.error);
            }
        } catch (error) {
            showError('Ошибка сервера: ' + error.message);
        }
    }
    
    function loadUserPanel() {
        document.getElementById('userName').innerText = currentUser.username;
        document.getElementById('regDate').innerText = new Date(currentUser.registered).toLocaleDateString();
        const roleSpan = document.getElementById('userRole');
        roleSpan.innerText = currentUser.role === 'admin' ? 'Администратор' : (currentUser.role === 'premium' ? 'Premium' : 'Игрок');
        roleSpan.className = `role role-${currentUser.role === 'admin' ? 'admin' : (currentUser.role === 'premium' ? 'premium' : 'user')}`;
        checkGameInstalled();
        loadOnlinePlayers();
        setInterval(loadOnlinePlayers, 30000);
    }
    
    function checkGameInstalled() {
        const installed = currentUser.gameInstalled;
        document.getElementById('installGameBtn').style.display = installed ? 'none' : 'block';
        document.getElementById('playGameBtn').style.display = installed ? 'block' : 'none';
    }
    
    function showInstructions() {
        const modal = document.createElement('div');
        modal.className = 'modal';
        modal.innerHTML = `
            <div class="modal-content">
                <h2 style="color: #ffd700; margin-bottom: 20px;">📖 Инструкция по установке</h2>
                <div class="instruction-step">
                    <div class="step-number">1</div>
                    <div>Скачайте файл <strong>PolitMine_Setup.bat</strong></div>
                </div>
                <div class="instruction-step">
                    <div class="step-number">2</div>
                    <div>Найдите скачанный файл в папке <strong>Загрузки</strong></div>
                </div>
                <div class="instruction-step">
                    <div class="step-number">3</div>
                    <div><strong style="color: #ffd700;">ЗАПУСТИТЕ ФАЙЛ ОБЫЧНЫМ ДВОЙНЫМ КЛИКОМ</strong><br>Скрипт сам запросит права администратора</div>
                </div>
                <div class="instruction-step">
                    <div class="step-number">4</div>
                    <div>Если Windows покажет предупреждение, нажмите <strong>"Да"</strong></div>
                </div>
                <div class="instruction-step">
                    <div class="step-number">5</div>
                    <div>Дождитесь окончания установки (около 2-5 минут)</div>
                </div>
                <div class="instruction-step">
                    <div class="step-number">6</div>
                    <div>Вернитесь в лаунчер и нажмите <strong>"ЗАПУСТИТЬ ИГРУ"</strong></div>
                </div>
                <button onclick="this.closest('.modal').remove()" style="margin-top: 20px; background: #4caf50;">Понятно, приступаю!</button>
            </div>
        `;
        document.body.appendChild(modal);
    }
    
    // Функция для получения ID из ссылки Google Drive
    function extractGoogleDriveId(url) {
        const match = url.match(/[-\w]{25,}/);
        return match ? match[0] : url;
    }
    
    function installGame() {
        let driveId = document.getElementById('gameUrlSetting').value.trim();
        if (!driveId) {
            showError('Введите ссылку или ID файла Google Drive в настройках');
            return;
        }
        
        // Извлекаем ID из ссылки, если вставлена полная ссылка
        driveId = extractGoogleDriveId(driveId);
        
        // Формируем прямую ссылку для скачивания
        const GAME_URL = `https://drive.google.com/uc?export=download&id=${driveId}`;
        
        // Создаём улучшенный BAT файл
        const batContent = `@echo off
setlocal enabledelayedexpansion

:: Проверка прав администратора
net session >nul 2>&1
if %errorlevel% neq 0 (
    echo Запрос прав администратора...
    powershell -Command "Start-Process '%~f0' -Verb RunAs"
    exit /b
)

chcp 1251 >nul
title PolitMine - Установка
color 0A
echo.
echo ========================================
echo         ПОЛИТМИНЕ - УСТАНОВКА
echo ========================================
echo.

:: Проверка диска D:
if not exist "D:\\" (
    echo [ОШИБКА] Диск D: не найден!
    echo Создайте раздел D: или подключите флешку
    pause
    exit /b 1
)

:: Создание папки
if not exist "D:\\PolitMine" mkdir "D:\\PolitMine" 2>nul
cd /d "D:\\PolitMine"

echo [1/4] Скачивание игры (88 МБ)...
echo Это может занять несколько минут...
echo.

:: Скачивание через PowerShell с Google Drive
powershell -Command "& {
    $url = '${GAME_URL}'
    $output = 'D:\\PolitMine\\game.zip'
    Write-Host 'Скачивание с Google Drive...'
    try {
        $webClient = New-Object System.Net.WebClient
        $webClient.DownloadFile($url, $output)
        Write-Host 'Скачивание завершено!'
    } catch {
        Write-Host 'Ошибка скачивания:' $_.Exception.Message
        exit 1
    }
}"

if %errorlevel% neq 0 (
    echo [ОШИБКА] Не удалось скачать файл!
    echo Проверьте интернет и ссылку
    pause
    exit /b 1
)

:: Проверка размера файла
if exist "game.zip" (
    for %%A in ("game.zip") do set size=%%~zA
    echo Размер файла: !size! байт
    if !size! LSS 10000000 (
        echo [ОШИБКА] Файл слишком маленький! Ссылка не работает
        pause
        exit /b 1
    )
) else (
    echo [ОШИБКА] Файл не скачан!
    pause
    exit /b 1
)

echo [2/4] Распаковка архива...
powershell -Command "Expand-Archive -Path 'D:\\PolitMine\\game.zip' -DestinationPath 'D:\\PolitMine' -Force"

if %errorlevel% neq 0 (
    echo [ОШИБКА] Не удалось распаковать архив
    pause
    exit /b 1
)

echo [3/4] Очистка...
del "game.zip" 2>nul

echo [4/4] Создание запускаемого файла...
(
echo @echo off
echo cd /d "D:\\PolitMine"
echo title PolitMine - Запуск
echo color 0A
echo echo ========================================
echo echo         ЗАПУСК ПОЛИТМИНЕ
echo echo ========================================
echo echo.
echo if not exist "minecraft.jar" (
echo     echo [ОШИБКА] Файл minecraft.jar не найден!
echo     echo Попробуйте переустановить игру
echo     pause
echo     exit /b 1
echo )
echo java -jar minecraft.jar
echo pause
) > "D:\\PolitMine\\start.bat"

echo.
echo ========================================
echo         УСТАНОВКА ЗАВЕРШЕНА!
echo ========================================
echo.
echo Игра установлена в: D:\\PolitMine
echo.
echo Теперь нажмите "ЗАПУСТИТЬ ИГРУ" в лаунчере
echo.
pause
`;
        
        // Скачиваем BAT файл
        const blob = new Blob([batContent], {type: 'application/bat;charset=windows-1251'});
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = 'PolitMine_Setup.bat';
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        URL.revokeObjectURL(url);
        
        showInstructions();
        
        setTimeout(async () => {
            const confirmed = confirm('Установка завершена?\nНажмите "ОК", если игра успешно установлена');
            if (confirmed) {
                await fetch(`${API_URL}/api/update-installed`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username: currentUser.username, installed: true })
                }).catch(e => console.log('Ошибка:', e));
                currentUser.gameInstalled = true;
                checkGameInstalled();
                showSuccess('Игра успешно установлена!');
            }
        }, 180000);
    }
    
    function launchGame() {
        const launchContent = `@echo off
net session >nul 2>&1
if %errorlevel% neq 0 (
    powershell -Command "Start-Process '%~f0' -Verb RunAs"
    exit /b
)
chcp 1251 >nul
title PolitMine - Запуск
color 0A
cd /d "D:\\PolitMine"
if not exist "start.bat" (
    echo [ОШИБКА] Игра не установлена!
    echo Запустите установку через лаунчер
    pause
    exit /b 1
)
echo Запуск PolitMine...
start "" "start.bat"
exit
`;
        
        const blob = new Blob([launchContent], {type: 'application/bat;charset=windows-1251'});
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = 'PolitMine_Launch.bat';
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        URL.revokeObjectURL(url);
        
        showSuccess('Файл запуска скачан! Запустите его двойным кликом');
    }
    
    async function loadOnlinePlayers() {
        try {
            const response = await fetch(`${API_URL}/api/online`);
            const data = await response.json();
            document.getElementById('onlineCount').innerText = data.count;
            const container = document.getElementById('onlinePlayersList');
            if (data.online.length === 0) {
                container.innerHTML = '<div style="text-align: center; color: rgba(255,255,255,0.5);">👻 Никого нет онлайн</div>';
                return;
            }
            container.innerHTML = data.online.map(u => `<div class="online-player"><span>🎮 ${u.username}</span><span class="status-badge">${u.role === 'admin' ? '👑 Админ' : (u.role === 'premium' ? '⭐ Premium' : '🟢 Игрок')}</span></div>`).join('');
        } catch (error) {
            console.error('Ошибка загрузки онлайн:', error);
        }
    }
    
    // Админ функции
    function showAdminLogin() {
        document.getElementById('authTabs').style.display = 'none';
        document.getElementById('adminLoginForm').style.display = 'block';
    }
    
    function backToUserLogin() {
        document.getElementById('authTabs').style.display = 'block';
        document.getElementById('adminLoginForm').style.display = 'none';
        document.getElementById('adminPanel').style.display = 'none';
    }
    
    let adminAuth = { username: null, password: null };
    
    async function adminLogin() {
        const username = document.getElementById('adminUsername').value;
        const password = document.getElementById('adminPassword').value;
        adminAuth = { username, password };
        
        try {
            const response = await fetch(`${API_URL}/api/users`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ adminUsername: username, adminPassword: password })
            });
            const data = await response.json();
            if (data.success) {
                showSuccess('Вход в админ-панель');
                loadAdminPanel(data.users);
                document.getElementById('adminLoginForm').style.display = 'none';
                document.getElementById('adminPanel').style.display = 'block';
            } else {
                showError(data.error);
            }
        } catch (error) {
            showError('Ошибка: ' + error.message);
        }
    }
    
    function loadAdminPanel(users) {
        document.getElementById('totalUsers').innerText = users.length;
        const online = users.filter(u => u.lastLogin && (new Date() - new Date(u.lastLogin)) < 2*60*60*1000);
        document.getElementById('adminOnlineCount').innerText = online.length;
        document.getElementById('installedCount').innerText = users.filter(u => u.gameInstalled).length;
        
        document.getElementById('usersList').innerHTML = users.map(u => `
            <div class="user-list-item">
                <div><strong>${u.username}</strong><br><small>${u.email}</small></div>
                <div>
                    <select class="role-select" onchange="changeRole('${u.username}', this.value)">
                        <option value="user" ${u.role === 'user' ? 'selected' : ''}>👤 Игрок</option>
                        <option value="premium" ${u.role === 'premium' ? 'selected' : ''}>⭐ Premium</option>
                        <option value="admin" ${u.role === 'admin' ? 'selected' : ''}>👑 Админ</option>
                    </select>
                </div>
            </div>
        `).join('');
    }
    
    async function changeRole(username, newRole) {
        try {
            await fetch(`${API_URL}/api/update-role`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    adminUsername: adminAuth.username,
                    adminPassword: adminAuth.password,
                    targetUsername: username,
                    newRole: newRole
                })
            });
            showSuccess(`Роль ${username} изменена`);
            const usersResp = await fetch(`${API_URL}/api/users`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ adminUsername: adminAuth.username, adminPassword: adminAuth.password })
            });
            const usersData = await usersResp.json();
            if (usersData.success) loadAdminPanel(usersData.users);
        } catch (error) {
            showError('Ошибка: ' + error.message);
        }
    }
    
    function exitAdmin() {
        document.getElementById('adminPanel').style.display = 'none';
        document.getElementById('authTabs').style.display = 'block';
        document.getElementById('adminLoginForm').style.display = 'none';
    }
    
    function updateGameUrl() {
        const newUrl = document.getElementById('gameUrlSetting').value;
        localStorage.setItem('game_url', newUrl);
        showSuccess('Ссылка сохранена! Теперь можно устанавливать игру');
    }
    
    function logout() {
        localStorage.removeItem('current_user');
        currentUser = null;
        location.reload();
    }
    
    function switchTab(tab) {
        const loginForm = document.getElementById('loginForm');
        const registerForm = document.getElementById('registerForm');
        const tabs = document.querySelectorAll('.tab');
        tabs.forEach(t => t.classList.remove('active'));
        if (tab === 'login') {
            loginForm.style.display = 'block';
            registerForm.style.display = 'none';
            tabs[0].classList.add('active');
        } else {
            loginForm.style.display = 'none';
            registerForm.style.display = 'block';
            tabs[1].classList.add('active');
        }
        hideMessages();
    }
    
    function showError(msg) {
        const errorDiv = document.getElementById('errorMsg');
        errorDiv.innerText = msg;
        errorDiv.style.display = 'block';
        setTimeout(() => errorDiv.style.display = 'none', 3000);
    }
    
    function showSuccess(msg) {
        const successDiv = document.getElementById('successMsg');
        successDiv.innerText = msg;
        successDiv.style.display = 'block';
        setTimeout(() => successDiv.style.display = 'none', 3000);
    }
    
    function hideMessages() {
        document.getElementById('errorMsg').style.display = 'none';
        document.getElementById('successMsg').style.display = 'none';
    }
    
    window.onload = function() {
        const savedUser = localStorage.getItem('current_user');
        if (savedUser) {
            try {
                currentUser = JSON.parse(savedUser);
                document.getElementById('authTabs').style.display = 'none';
                document.getElementById('userPanel').style.display = 'block';
                document.getElementById('gameSection').style.display = 'block';
                loadUserPanel();
            } catch(e) {
                console.log('Ошибка загрузки пользователя');
            }
        }
    };
</script>
</body>
</html>
